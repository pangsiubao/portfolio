<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link

  <body>
    <header>
      <a href="index.html" class="logo">Tine Siu</a>

      <nav class="nav-bar" aria-label="Hoofdmenu">

    <main>
      <section class="hero hero--dark">
        <h1>Projecten</h1>
      </section>

      <section class="section" aria-label="Projectenoverzicht">
        <div class="container filters">
          <label for="filter-taal">Taal</label>
          <select id="filter-taal">
            <option value="alle">Alle talen</option>

            <option value="Python">Python</option>

            <option value="nieuw">Nieuwste eerst</option>
            <option value="oud">Oudste eerst</option>
            <option value="titel">Titel (A-Z)</option>
          </select>
        </div>

        <p id="status" class="container" aria-live="polite">Projecten laden…</p>

        <div class="container card-grid" id="projecten-lijst"></div>
      </section>

    <footer>
